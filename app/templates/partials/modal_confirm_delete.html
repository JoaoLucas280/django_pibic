<form method="post" hx-post="{{ request.path }}" hx-target="#action-modal-content" hx-swap="innerHTML">
  {% csrf_token %}
  <h3 class="h5">Excluir "{{ object }}"?</h3>
  {% if error %}
  <div class="alert alert-warning" role="alert">{{ error }}</div>
  {% else %}
  <p class="text-muted">Essa ação não pode ser desfeita.</p>
  {% endif %}
  <div class="d-flex gap-2">
    {% if not error %}<button type="submit" class="btn btn-danger">Excluir</button>{% endif %}
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
  </div>
</form>
