<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title|default:"Início" }}{% endblock %} - Gestão acadêmica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #1b2a41;
      --paper: #f5f6f8;
      --surface: #ffffff;
      --line: #dde1e7;
      --accent: #2f6f73;
      --accent-dark: #265c60;
      --muted: #5b6575;
    }
    body { background: var(--paper); color: var(--ink); font-family: "Source Sans 3", system-ui, sans-serif; }
    h1, h2, h3, .navbar-brand { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; }
    .navbar { background: var(--ink); }
    .navbar .nav-link { color: #c9d1de; }
    .navbar .nav-link:hover, .navbar .nav-link.active { color: #ffffff; }
    .navbar .nav-link.active { box-shadow: inset 0 -2px 0 var(--accent); }
    .btn-primary {
      --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent);
      --bs-btn-hover-bg: var(--accent-dark); --bs-btn-hover-border-color: var(--accent-dark);
      --bs-btn-active-bg: var(--accent-dark); --bs-btn-active-border-color: var(--accent-dark);
    }
    a { color: var(--accent); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .table { --bs-table-bg: transparent; margin-bottom: 0; }
    .table th { color: var(--muted); font-weight: 600; font-size: .9rem; }
    .semester { border-left: 3px solid var(--accent); }
    .field input[type=text], .field input[type=email], .field input[type=number], .field select {
      display: block; width: 100%; padding: .5rem .75rem; border: 1px solid #b8c0cc;
      border-radius: 6px; background: #fff; font: inherit; color: inherit;
    }
    .field select[multiple] { min-height: 12rem; }
    .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'curso:course_list' %}">Gestão acadêmica</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if 'course' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'curso:course_list' %}">Cursos</a></li>
          <li class="nav-item"><a class="nav-link {% if 'discipline' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'curso:discipline_list' %}">Disciplinas</a></li>
          <li class="nav-item"><a class="nav-link {% if 'student' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'aluno:student_list' %}">Alunos</a></li>
        </ul>
        <a class="nav-link text-white-50" href="{% url 'admin:index' %}">Administração</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/action_modal.html" %}

  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const actionModal = document.getElementById("action-modal");
    actionModal.addEventListener("show.bs.modal", function (event) {
      const trigger = event.relatedTarget;
      const title = trigger.getAttribute("data-modal-title");
      document.getElementById("action-modal-title").textContent = title;
      document.getElementById("action-modal-content").innerHTML =
        '<p class="text-muted mb-0">Carregando...</p>';
    });

    document.body.addEventListener("actionModalDone", function () {
      bootstrap.Modal.getInstance(actionModal).hide();
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
