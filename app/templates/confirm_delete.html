{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel p-4">
      <h1 class="h4">Excluir "{{ object }}"?</h1>
      <p class="text-muted mt-2">Essa ação não pode ser desfeita. Registros ligados a este item também podem ser excluídos: ao apagar um curso, por exemplo, seus semestres e alunos vão junto.</p>
      <form method="post" class="d-flex gap-2 mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Excluir</button>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
